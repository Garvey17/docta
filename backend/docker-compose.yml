version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: docta-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-docta-dev-jwt-secret-key-fargate-ready-123456}
      - USE_MOCK_AI=true
      - USE_MOCK_RAG=true
      - ENVIRONMENT=development
      - PORT=8000
    volumes:
      - ./uploads:/app/uploads
