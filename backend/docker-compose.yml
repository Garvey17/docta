version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: docta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: docta_db
    ports:
      - "5432:5432"
    volumes:
      - docta_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docta_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: docta-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/docta_db
      - SECRET_KEY=docta-dev-jwt-secret-key-fargate-ready-123456
      - USE_MOCK_AI=true
      - USE_MOCK_RAG=false
      - ENVIRONMENT=development
      - PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  docta_pgdata:
